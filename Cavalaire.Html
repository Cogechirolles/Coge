<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendrier de réservation - Cavalaire</title>

  <!-- FullCalendar -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css">

  <!-- Tippy (tooltips) -->
  <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/dist/tippy.css">

  <style>
    body { font-family: Arial, sans-serif; margin: 18px; }
    h1 { margin: 0 0 14px 0; font-size: 44px; font-weight: 800; }

    #calendar { max-width: 1100px; margin: 0 auto; }

    /* Fond doux + bordures */
    .fc .fc-daygrid-day-frame { background: #fbf6df; }
    .fc-theme-standard td, .fc-theme-standard th { border-color: #d9d9d9; }

    /* --- Demi-journées dans chaque case --- */
    .coge-halves {
      position: absolute;
      left: 0; right: 0;
      top: 22px; bottom: 0;  /* sous le numéro du jour */
      display: flex;
      flex-direction: column;
      pointer-events: none;
    }
    .coge-half {
      flex: 1;
      border-top: 1px solid rgba(0,0,0,0.07);
      position: relative;
      overflow: hidden;
      padding: 0;
    }
    .coge-half + .coge-half {
      border-top: 1px solid rgba(0,0,0,0.12);
    }

    /* --- Barres custom (collées) --- */
    .coge-bar {
      pointer-events: auto; /* pour tooltip */
      font-size: 12px;
      line-height: 1.1;
      padding: 2px 6px;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      display: block;
      width: calc(100% + 2px);
      margin-left: -1px;
      margin-right: -1px;
    }
    .coge-start { border-radius: 8px 0 0 8px; }
    .coge-end   { border-radius: 0 8px 8px 0; }
    .coge-middle{ border-radius: 0; }

    /* Couleurs (statut) */
    .coge-attente { background: #add8e6; color: #0b2233; }
    .coge-validee { background: #a8e6a2; color: #0b2a0b; }
    .coge-refusee { background: #f7b2b0; color: #3b0b0b; }

    /* On cache UNIQUEMENT le rendu natif des réservations (pas les backgrounds) */
    .coge-hide-native { display: none !important; }

    .legend {
      max-width: 1100px;
      margin: 14px auto 0 auto;
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .legend span {
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      display: inline-block;
    }
  </style>
</head>

<body>
  <h1>Calendrier de réservation - Cavalaire</h1>
  <div id="calendar"></div>

  <div class="legend">
    <span class="coge-attente">Réservation en Attente</span>
    <span class="coge-validee">Réservation Validée</span>
    <span class="coge-refusee">Réservation Refusée</span>
  </div>

  <!-- Librairies -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="https://unpkg.com/@popperjs/core@2"></script>
  <script src="https://unpkg.com/tippy.js@6"></script>

  <!-- Ton code -->
  <script src="Cavalaire.js"></script>
</body>
</html>
