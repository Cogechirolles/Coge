<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendrier de réservation - Cavalaire</title>

  <!-- FullCalendar (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 18px;
    }

    h1 {
      margin: 0 0 14px 0;
      font-size: 44px;
      font-weight: 800;
    }

    /* Taille et rendu */
    #calendar {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Fond “doux” (comme ta capture) */
    .fc .fc-daygrid-day-frame {
      background: #fbf6df;
    }
    .fc-theme-standard td, .fc-theme-standard th {
      border-color: #d9d9d9;
    }

    /* ======== Demi-journées dans chaque case jour ======== */
    .coge-halves {
      position: absolute;
      left: 0;
      right: 0;
      top: 22px;       /* sous le numéro du jour */
      bottom: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
      pointer-events: none; /* important : pas de clic */
    }

    .coge-half {
      flex: 1;
      border-top: 1px solid rgba(0,0,0,0.06);
      position: relative;
      overflow: hidden;
    }

    /* optionnel : ligne verticale au milieu (pour “sentir” AM/PM) */
    .coge-half + .coge-half {
      border-top: 1px solid rgba(0,0,0,0.10);
    }

    /* ======== “Barre” réservation (collée) ======== */
    .coge-bar {
      pointer-events: none;
      font-size: 12px;
      line-height: 1.1;
      padding: 2px 6px;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-radius: 0;
      display: block;

      /* on “déborde” un peu pour coller aux bords des cellules */
      width: calc(100% + 2px);
      margin-left: -1px;
      margin-right: -1px;
    }

    /* extrémités arrondies */
    .coge-start { border-radius: 8px 0 0 8px; }
    .coge-end   { border-radius: 0 8px 8px 0; }
    .coge-middle{ border-radius: 0; }

    /* couleurs (comme ta légende) */
    .coge-attente { background: #8ecae6; color: #0b2233; }
    .coge-validee { background: #8ee28e; color: #0b2a0b; }
    .coge-refusee { background: #f2a3a3; color: #3b0b0b; }

    /* ======== On cache le rendu “barres” natif FullCalendar ======== */
    .fc-daygrid-event-harness,
    .fc-daygrid-event {
      display: none !important;
    }

    /* Légende */
    .legend {
      max-width: 1100px;
      margin: 14px auto 0 auto;
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .legend span {
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      display: inline-block;
    }
  </style>
</head>

<body>
  <h1>Calendrier de réservation - Cavalaire</h1>

  <div id="calendar"></div>

  <div class="legend">
    <span class="coge-attente">Réservation en Attente</span>
    <span class="coge-validee">Réservation Validée</span>
    <span class="coge-refusee">Réservation Refusée</span>
  </div>

  <!-- FullCalendar -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <!-- Ton code -->
  <script src="Cavalaire.js"></script>
</body>
</html>
