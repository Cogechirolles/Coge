<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Administration — Connexion</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; background:#f5f6f8; }
    .wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
    .card { width: 100%; max-width: 420px; background:#fff; border-radius:14px; box-shadow: 0 10px 30px rgba(0,0,0,.08); padding:18px; }
    h1 { font-size:20px; margin:0 0 10px; }
    p { margin:0 0 14px; color:#444; font-size:14px; line-height:1.4; }
    label { display:block; font-size:13px; color:#333; margin:10px 0 6px; }
    input { width:100%; padding:12px 12px; border-radius:10px; border:1px solid #d8dde6; font-size:15px; }
    input:focus { outline:none; border-color:#7aa7ff; box-shadow:0 0 0 3px rgba(122,167,255,.25); }
    button { width:100%; margin-top:14px; padding:12px; border-radius:10px; border:0; background:#1f6feb; color:#fff; font-size:15px; cursor:pointer; }
    button:disabled { opacity:.7; cursor:not-allowed; }
    .msg { margin-top:12px; font-size:14px; }
    .msg.ok { color:#0a7b2b; }
    .msg.err { color:#b00020; }
    .tiny { margin-top:14px; font-size:12px; color:#666; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Accès Administration</h1>
      <p>Veuillez saisir vos identifiants.</p>

      <form id="loginForm" autocomplete="off">
        <label for="login">Identifiant</label>
        <input id="login" name="login" type="text" required />

        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" required />

        <button id="btn" type="submit">Connexion</button>

        <div id="msg" class="msg" role="status" aria-live="polite"></div>
        <div class="tiny">Si vous n’avez pas d’accès, contactez un administrateur principal.</div>
      </form>
    </div>
  </div>

  <script src="./admin-auth.js"></script>
  <script>
    // Si déjà connecté, on renvoie direct.
    if (AdminAuth.isLoggedIn()) {
      window.location.href = "./admin.html";
    }

    const form = document.getElementById("loginForm");
    const btn = document.getElementById("btn");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";
      msg.className = "msg";

      const login = document.getElementById("login").value.trim();
      const password = document.getElementById("password").value;

      if (!login || !password) {
        msg.textContent = "Veuillez compléter les deux champs.";
        msg.className = "msg err";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Connexion…";

      try {
        const res = await AdminAuth.login(login, password);
        if (res.ok) {
          msg.textContent = `Bienvenue ${res.admin?.prenom ?? ""} ${res.admin?.nom ?? ""}`.trim();
          msg.className = "msg ok";
          window.location.href = "./admin.html";
        } else {
          msg.textContent = res.message || "Accès refusé.";
          msg.className = "msg err";
        }
      } catch (err) {
        msg.textContent = "Erreur réseau. Réessayez.";
        msg.className = "msg err";
      } finally {
        btn.disabled = false;
        btn.textContent = "Connexion";
      }
    });
  </script>
</body>
</html>
