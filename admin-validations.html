<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin — Validations</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:#f5f6f8;}
    header{background:#fff;padding:14px 16px;box-shadow:0 3px 16px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
    .wrap{padding:16px;max-width:1050px;margin:0 auto}
    .card{background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.06);padding:14px}
    h1{margin:0;font-size:18px}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
    button{padding:10px 12px;border-radius:10px;border:0;cursor:pointer;font-size:14px}
    button.primary{background:#1f6feb;color:#fff}
    button.good{background:#2dba4e;color:#fff}
    button.bad{background:#b00020;color:#fff}
    button.ghost{background:#eef2ff}
    button:disabled{opacity:.6;cursor:not-allowed}
    .muted{color:#666;font-size:13px}
    .list{margin-top:12px;display:grid;gap:10px}
    .item{border:1px solid #e6e8ee;border-radius:12px;padding:12px}
    .name{font-weight:700}
    .sub{font-size:13px;color:#444;margin-top:2px}
    .meta{font-size:12px;color:#666;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
    .pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#f1f5f9;font-size:12px;color:#334155}
    .pill.conf{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}
    .actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
    .err{margin-top:10px;color:#b00020;font-size:13px}
  </style>
</head>
<body>
  <header>
    <div>
      <div style="font-weight:700">Validations</div>
      <div class="muted" id="who"></div>
    </div>
    <div class="row">
      <button class="ghost" onclick="location.href='./admin.html'">← Menu</button>
      <button id="refreshBtn" class="primary">Rafraîchir</button>
    </div>
  </header>

  <div class="wrap">
    <div class="card">
      <h1>Demandes en attente</h1>
      <div class="muted">Arrivées/Départs à midi : départ le même jour qu’une arrivée = OK.</div>
      <div id="err" class="err"></div>
      <div id="list" class="list"></div>
    </div>
  </div>

  <script src="./admin-auth.js"></script>
  <script>
    AdminAuth.requireLogin();

    const admin = AdminAuth.getAdmin() || {};
    document.getElementById("who").textContent =
      `Connecté : ${(admin.prenom||"").trim()} ${(admin.nom||"").trim()}`.trim();

    const API = "https://coge-admin.cogechirolles.workers.dev";
    const listEl = document.getElementById("list");
    const errEl = document.getElementById("err");
    const refreshBtn = document.getElementById("refreshBtn");

    function fmt(d){ return d ? String(d).slice(0,10).split("-").reverse().join("/") : ""; }
    function getField(fields, name){
      const v = fields?.[name];
      if (Array.isArray(v)) return v[0] ?? "";
      return v ?? "";
    }

    async function load(){
      errEl.textContent = "";
      listEl.innerHTML = "";
      refreshBtn.disabled = true;
      refreshBtn.textContent = "Chargement…";
      try{
        const r = await AdminAuth.authedFetch(`${API}/admin/pending`);
        const data = await r.json();
        if(!r.ok || !data.ok) throw new Error(data.message || "Erreur API");
        render(data.pending || []);
      }catch(e){
        errEl.textContent = "Erreur : " + (e.message || e);
      }finally{
        refreshBtn.disabled = false;
        refreshBtn.textContent = "Rafraîchir";
      }
    }

    function render(items){
      if(!items.length){
        listEl.innerHTML = `<div class="muted">Aucune demande en attente.</div>`;
        return;
      }
      for(const it of items){
        const f = it.fields || {};
        const abonne = getField(f, "Nom de l'abonné") || "(sans nom)";
        const ext = getField(f, "Nom de l’Extérieur"); // ✅ champ exact
        const apt = getField(f, "Appartement");
        const start = getField(f, "Date de début");
        const end = getField(f, "Date de fin");
        const price = getField(f, "Prix total");
        const resId = getField(f, "ID réservation");

        const cv = it.conflictCountValidated || 0;
        const cp = it.conflictCountPending || 0;

        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
          <div class="name">${abonne}${ext ? ` — ${ext}` : ""}</div>
          <div class="sub">${apt || ""} • ${fmt(start)} → ${fmt(end)}</div>
          <div class="meta">
            ${resId ? `<span class="pill">ID: ${resId}</span>` : ""}
            ${price !== "" ? `<span class="pill">Prix: ${price} €</span>` : ""}
            ${(cv||cp) ? `<span class="pill conf">Conflits: ${cv} validée(s), ${cp} en attente</span>` : `<span class="pill">Aucun conflit détecté</span>`}
          </div>
          <div class="actions">
            <button class="good" data-act="approve">Valider</button>
            <button class="bad" data-act="reject">Refuser</button>
            <button class="ghost" data-act="conflicts">Voir conflits</button>
          </div>
        `;

        div.querySelector('[data-act="approve"]').onclick = () => approve(it.id);
        div.querySelector('[data-act="reject"]').onclick = () => reject(it.id);
        div.querySelector('[data-act="conflicts"]').onclick = () => showConflicts(it.id);

        listEl.appendChild(div);
      }
    }

    async function approve(id){
      if(!confirm("Valider cette réservation ?")) return;
      errEl.textContent = "";
      try{
        const r = await AdminAuth.authedFetch(`${API}/admin/approve`, {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ id })
        });
        const data = await r.json();
        if(!r.ok || !data.ok) throw new Error(data.message || "Erreur validation");
        if(data.blocked){
          alert("Conflit avec une réservation VALIDÉE. Merci d’arbitrer et/ou modifier la demande avant validation.");
          return;
        }
        await load();
      }catch(e){
        errEl.textContent = "Erreur : " + (e.message || e);
      }
    }

    async function reject(id){
      if(!confirm("Refuser cette réservation ?")) return;
      errEl.textContent = "";
      try{
        const r = await AdminAuth.authedFetch(`${API}/admin/reject`, {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ id })
        });
        const data = await r.json();
        if(!r.ok || !data.ok) throw new Error(data.message || "Erreur refus");
        await load();
      }catch(e){
        errEl.textContent = "Erreur : " + (e.message || e);
      }
    }

    async function showConflicts(id){
      errEl.textContent = "";
      try{
        const r = await AdminAuth.authedFetch(`${API}/admin/conflicts?id=${encodeURIComponent(id)}`);
        const data = await r.json();
        if(!r.ok || !data.ok) throw new Error(data.message || "Erreur conflits");
        const conflicts = data.conflicts || [];
        if(!conflicts.length){ alert("Aucun conflit."); return; }
        const lines = conflicts.map(c=>{
          const f = c.fields || {};
          const who = (f["Nom de l'abonné"] || "") + (f["Nom de l’Extérieur"] ? (" — " + f["Nom de l’Extérieur"]) : "");
          const apt = Array.isArray(f["Appartement"]) ? f["Appartement"][0] : f["Appartement"];
          const fmt2 = (d)=> d ? String(d).slice(0,10).split("-").reverse().join("/") : "";
          return `• ${who} / ${apt} / ${fmt2(f["Date de début"])} → ${fmt2(f["Date de fin"])} / ${f["Statut de la demande"]}`;
        });
        alert("Conflits :\n" + lines.join("\n"));
      }catch(e){
        errEl.textContent = "Erreur : " + (e.message || e);
      }
    }

    refreshBtn.addEventListener("click", load);
    load();
  </script>
</body>
</html>
