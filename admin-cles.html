<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin — Gestion des clés</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:#f5f6f8;}
    header{background:#fff;padding:14px 16px;box-shadow:0 3px 16px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
    .wrap{padding:16px;max-width:1050px;margin:0 auto}
    .card{background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.06);padding:14px}
    h1{margin:0;font-size:18px}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
    button{padding:10px 12px;border-radius:10px;border:0;cursor:pointer;font-size:14px}
    button.primary{background:#1f6feb;color:#fff}
    button.ghost{background:#eef2ff}
    button:disabled{opacity:.6;cursor:not-allowed}
    .muted{color:#666;font-size:13px}
    .list{margin-top:12px;display:grid;gap:10px}
    .item{border:1px solid #e6e8ee;border-radius:12px;padding:12px}
    .name{font-weight:700}
    .sub{font-size:13px;color:#444;margin-top:2px}
    .grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
    @media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
    label{font-size:12px;color:#555;display:block;margin-bottom:6px}
    select,input{width:100%;padding:10px;border-radius:10px;border:1px solid #d8dde6;font-size:14px;background:#fff}
    input[readonly]{background:#f3f4f6}
    .actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .hint{font-size:12px;color:#666;margin-top:6px}
    .err{margin-top:10px;color:#b00020;font-size:13px}
    .ok{margin-top:10px;color:#0a7b2b;font-size:13px}
  </style>
</head>
<body>
  <header>
    <div>
      <div style="font-weight:700">Gestion des clés</div>
      <div class="muted" id="who"></div>
    </div>
    <div class="row">
      <button class="ghost" onclick="location.href='./admin.html'">← Menu</button>
      <button id="refreshBtn" class="primary">Rafraîchir</button>
    </div>
  </header>

  <div class="wrap">
    <div class="card">
      <h1>Réservations validées à venir</h1>
      <div class="muted">
        Les champs “Remis par / Récupérées par” sont automatiques (admin connecté). Tu gardes uniquement les dates + le bouton Enregistrer.
      </div>

      <div id="err" class="err"></div>
      <div id="ok" class="ok"></div>
      <div id="list" class="list"></div>
    </div>
  </div>

  <script src="./admin-auth.js"></script>
  <script>
    AdminAuth.requireLogin();

    const admin = AdminAuth.getAdmin() || {};
    const adminId = admin.Id || ""; // champ demandé: "Id"
    const adminName = [admin.prenom, admin.nom].filter(Boolean).join(" ").trim() || "Administrateur";

    document.getElementById("who").textContent = `Connecté : ${adminName}`;

    const API = "https://coge-admin.cogechirolles.workers.dev";
    const listEl = document.getElementById("list");
    const errEl = document.getElementById("err");
    const okEl = document.getElementById("ok");
    const refreshBtn = document.getElementById("refreshBtn");

    function fmt(d){ return d ? String(d).slice(0,10).split("-").reverse().join("/") : ""; }
    function getField(fields, name){
      const v = fields?.[name];
      if (Array.isArray(v)) return v[0] ?? "";
      return v ?? "";
    }
    function toNumberOrEmpty(v){
      if (v === null || v === undefined || v === "") return "";
      const n = Number(String(v).replace(",", "."));
      return Number.isFinite(n) ? n : "";
    }
    function toNumberOrZero(v){
      const n = Number(String(v ?? "").replace(",", "."));
      return Number.isFinite(n) ? n : 0;
    }

    async function load(){
      errEl.textContent = "";
      okEl.textContent = "";
      listEl.innerHTML = "";
      refreshBtn.disabled = true;
      refreshBtn.textContent = "Chargement…";
      try{
        if(!adminId){
          throw new Error("Admin.Id manquant. Reconnecte-toi (login) puis réessaie.");
        }
        const r = await AdminAuth.authedFetch(`${API}/admin/reservations?scope=upcoming`);
        const data = await r.json();
        if(!r.ok || !data.ok) throw new Error(data.message || "Erreur API");
        render(data.reservations || []);
      }catch(e){
        errEl.textContent = "Erreur : " + (e.message || e);
      }finally{
        refreshBtn.disabled = false;
        refreshBtn.textContent = "Rafraîchir";
      }
    }

    function render(items){
      if(!items.length){
        listEl.innerHTML = `<div class="muted">Aucune réservation validée à venir.</div>`;
        return;
      }

      for(const it of items){
        const f = it.fields || {};
        const abonne = getField(f, "Nom de l'abonné") || "(sans nom)";
        const ext = getField(f, "Nom de l’Extérieur");
        const apt = getField(f, "Appartement");
        const start = getField(f, "Date de début");
        const end = getField(f, "Date de fin");

        const keyset = getField(f, "Jeu de clés");
        const paid = getField(f, "Payé ?") || "";

        const priceTotal = toNumberOrEmpty(getField(f, "Prix total"));
        const paidAmountExisting = toNumberOrEmpty(getField(f, "Montant payé"));
        const paidAmountPrefill = (paidAmountExisting === "" ? (priceTotal === "" ? "" : priceTotal) : paidAmountExisting);

        const givenAt = getField(f, "Date de remise");            // YYYY-MM-DD
        const returnAt = getField(f, "Date de récupération");     // YYYY-MM-DD

        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
          <div class="name">${abonne}${ext ? ` — ${ext}` : ""}</div>
          <div class="sub">${apt || ""} • ${fmt(start)} → ${fmt(end)}</div>

          <div class="grid">
            <div>
              <label>Jeu de clés</label>
              <select data-k="Jeu de clés">
                <option value="">—</option>
                <option>Serre-Chevalier N°1</option>
                <option>Serre-Chevalier N°2</option>
                <option>Serre-Chevalier N°3</option>
                <option>Cavalaire N°1</option>
                <option>Cavalaire N°2</option>
                <option>Cavalaire N°3</option>
              </select>
            </div>

            <div>
              <label>Payé ?</label>
              <select data-k="Payé ?">
                <option value="">—</option>
                <option>Sumup</option>
                <option>Chèque</option>
                <option>Non</option>
              </select>
            </div>

            <div>
              <label>Montant payé</label>
              <input data-k="Montant payé" inputmode="decimal" placeholder="ex: 40" />
              <div class="hint">Pré-rempli avec “Prix total” si vide. Modifiable.</div>
            </div>

            <div>
              <label>Prix total (info)</label>
              <input value="${priceTotal === "" ? "" : String(priceTotal)}" readonly />
            </div>

            <div>
              <label>Remise le</label>
              <input data-k="Date de remise" type="date" />
            </div>

            <div>
              <label>Remis par</label>
              <input data-k="RemisPar" value="${adminName}" readonly />
              <div class="hint">Automatique : admin connecté</div>
            </div>

            <div>
              <label>Récupérées le</label>
              <input data-k="Date de récupération" type="date" />
            </div>

            <div>
              <label>Récupérées par</label>
              <input data-k="RecupPar" value="${adminName}" readonly />
              <div class="hint">Automatique : admin connecté</div>
            </div>
          </div>

          <div class="actions">
            <button class="primary" data-act="save">Enregistrer</button>
          </div>
        `;

        const selKey = div.querySelector('select[data-k="Jeu de clés"]');
        const selPaid = div.querySelector('select[data-k="Payé ?"]');
        const inpPaidAmount = div.querySelector('input[data-k="Montant payé"]');
        const inpGivenDate = div.querySelector('input[data-k="Date de remise"]');
        const inpReturnedDate = div.querySelector('input[data-k="Date de récupération"]');
        const btnSave = div.querySelector('[data-act="save"]');

        selKey.value = keyset || "";
        selPaid.value = paid || "";
        inpPaidAmount.value = paidAmountPrefill === "" ? "" : String(paidAmountPrefill);

        inpGivenDate.value = givenAt ? String(givenAt).slice(0,10) : "";
        inpReturnedDate.value = returnAt ? String(returnAt).slice(0,10) : "";

        btnSave.onclick = async () => {
          errEl.textContent = "";
          okEl.textContent = "";
          btnSave.disabled = true;
          btnSave.textContent = "Enregistrement…";
          try {
            const patch = {
              "Jeu de clés": selKey.value || "",
              "Payé ?": selPaid.value || "",
              "Montant payé": toNumberOrZero(inpPaidAmount.value),
              "Date de remise": inpGivenDate.value || "",
              "Date de récupération": inpReturnedDate.value || "",
            };

            // Si la date est renseignée -> on écrit aussi l'admin connecté (Option A)
            if (inpGivenDate.value) patch["Clés remise par"] = [adminId];
            if (inpReturnedDate.value) patch["Clés récupérées par"] = [adminId];

            await updateKeys(it.id, patch);
            okEl.textContent = "Enregistré ✅";
          } catch (e) {
            errEl.textContent = "Erreur : " + (e.message || e);
          } finally {
            btnSave.disabled = false;
            btnSave.textContent = "Enregistrer";
          }
        };

        listEl.appendChild(div);
      }
    }

    async function updateKeys(id, patch){
      const r = await AdminAuth.authedFetch(`${API}/admin/update-keys`, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ id, ...patch })
      });
      const data = await r.json().catch(() => null);
      if(!r.ok || !data || !data.ok) throw new Error(data?.message || "Erreur mise à jour");
      // Recharge pour que l’écran reflète Airtable
      await load();
    }

    refreshBtn.addEventListener("click", load);
    load();
  </script>
</body>
</html>
