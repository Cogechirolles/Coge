<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Administration - Réservations</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:0;background:#f6f7fb}
    header{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;background:#fff;border-bottom:1px solid #eceef5}
    header .left{display:flex;gap:10px;align-items:center}
    header a{color:#111;text-decoration:none;font-weight:600}
    .right{display:flex;gap:10px;align-items:center}
    .btn{padding:8px 10px;border-radius:10px;border:1px solid #d8dbe5;background:#fff;cursor:pointer;font-weight:700}
    .wrap{max-width:1100px;margin:18px auto;padding:0 12px}
    .card{background:#fff;border:1px solid #eceef5;border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 4px 18px rgba(0,0,0,.05);position:relative}
    .row{display:grid;grid-template-columns: 160px 160px 1fr 1fr 180px 160px;gap:10px;align-items:end}
    label{display:block;font-size:12px;color:#555;margin-bottom:5px}
    input{width:100%;padding:9px 10px;border:1px solid #d8dbe5;border-radius:10px;font-size:14px}
    .meta{font-size:13px;color:#333}
    .conflict{margin-top:10px;padding:10px;border-radius:10px;background:#fff3f3;border:1px solid #ffd2d2;color:#8a0000;font-size:13px}
    .okbox{margin-top:10px;padding:10px;border-radius:10px;background:#f1fff3;border:1px solid #c8f3cf;color:#0c5a1a;font-size:13px}
    .actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
    button{padding:9px 12px;border-radius:10px;border:1px solid #d8dbe5;background:#fff;cursor:pointer;font-weight:600}
    button.primary{background:#111;color:#fff;border-color:#111}
    button:disabled{opacity:.6;cursor:not-allowed}
    .topline{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:8px 0 12px}
    .small{font-size:13px;color:#555}
  </style>
</head>
<body>
<header>
  <div class="left">
    <a href="reservations.html">Réservations</a>
    <a href="cles.html">Gestion des clés</a>
    <a href="pointage.html">Pointage bancaire</a>
  </div>
  <div class="right">
    <div class="small" id="who"></div>
    <button class="btn" id="logout" type="button">Déconnexion</button>
  </div>
</header>

<div class="wrap">
  <div class="topline">
    <div>
      <div style="font-weight:700">Demandes en attente</div>
      <div class="small">Table : <b>Réservations</b> • Statut : <b>En attente</b></div>
    </div>
    <button id="reload" type="button">Rafraîchir</button>
  </div>

  <div id="list"></div>
</div>

<script>
const WORKER_BASE_URL = "https://pageadministration.cogechirolles.workers.dev";

function logout(){
  localStorage.removeItem("coge_admin_token");
  localStorage.removeItem("coge_admin_name");
  window.location.href = "login.html";
}

const token = localStorage.getItem("coge_admin_token");
const adminName = localStorage.getItem("coge_admin_name") || "";
document.getElementById("who").textContent = adminName ? `Connecté : ${adminName}` : "";
document.getElementById("logout").addEventListener("click", logout);

if (!token) {
  window.location.href = "login.html";
}

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));}
function field(fields, name){ return fields?.[name]; }

async function api(path, opts={}){
  const url = `${WORKER_BASE_URL}${path}`;

  const r = await fetch(url, {
    ...opts,
    headers: {
      ...(opts.headers||{}),
      "authorization": `Bearer ${token}`,
      "content-type": "application/json"
    }
  });

  const j = await r.json().catch(()=>({ok:false,error:"Réponse API invalide (pas du JSON)"}));
  if (!j.ok) {
    if (r.status === 401) logout();
    throw new Error(j.error || `Erreur API (${r.status})`);
  }
  return j;
}

function renderCard(item){
  const f = item.fields || {};
  const recordId = item.recordId;
  const dateDebut = (field(f,"Date de début")||"").slice(0,10);
  const dateFin = (field(f,"Date de fin")||"").slice(0,10);

  const nomA = field(f,"Nom de l'abonné") || "";
  const nomE = field(f,"Nom de l’Extérieur") || "";
  const apt = Array.isArray(field(f,"Appartement")) ? field(f,"Appartement")[0] : (field(f,"Appartement")||"");
  const prix = field(f,"Prix total");

  const conflicts = item.conflicts || [];
  const conflictHtml = conflicts.length ? `
    <div class="conflict">
      ⚠️ Conflit détecté (${conflicts.length}) sur <b>${esc(apt)}</b> :
      <ul style="margin:8px 0 0 18px">
        ${conflicts.map(c=>`<li>${esc(c.start)} → ${esc(c.end)}</li>`).join("")}
      </ul>
    </div>` : "";

  return `
  <div class="card" data-id="${esc(recordId)}">
    <div class="row">
      <div>
        <label>Date de début</label>
        <input type="date" class="dateDebut" value="${esc(dateDebut)}" />
      </div>
      <div>
        <label>Date de fin</label>
        <input type="date" class="dateFin" value="${esc(dateFin)}" />
      </div>

      <div class="meta">
        <label>Abonné</label>
        <div><b>${esc(nomA)}</b>${nomE?` — Extérieur : <b>${esc(nomE)}</b>`:""}</div>
      </div>

      <div class="meta">
        <label>Appartement</label>
        <div><b>${esc(apt)}</b></div>
      </div>

      <div class="meta">
        <label>Prix total</label>
        <div><b>${(prix!==undefined && prix!==null)?esc(prix)+" €":"-"}</b></div>
      </div>

      <div class="meta">
        <label>Actions dates</label>
        <div class="actions" style="margin:0">
          <button class="save" type="button">Enregistrer dates</button>
        </div>
      </div>
    </div>

    <div class="cardMsg" style="display:none"></div>

    ${conflictHtml}

    <div class="actions">
      <button class="primary validate" type="button">✅ Valider</button>
      <button class="refuse" type="button">❌ Refuser</button>
    </div>
  </div>`;
}

function setCardMsg(card, msg, ok=false){
  const box = card.querySelector(".cardMsg");
  if (!box) return;
  box.style.display = "block";
  box.className = ok ? "okbox cardMsg" : "conflict cardMsg";
  box.textContent = msg;
}

async function load(){
  const list = document.getElementById("list");
  list.innerHTML = "Chargement…";
  try{
    const j = await api("/api/reservations/pending", { method:"GET" });
    const items = j.records || [];
    if (!items.length) {
      list.innerHTML = "<div class='small'>Aucune demande en attente.</div>";
      return;
    }
    list.innerHTML = items.map(renderCard).join("");
  }catch(e){
    list.innerHTML = `<div class="conflict">Erreur : ${esc(e.message)}</div>`;
  }
}

document.getElementById("list").addEventListener("click", async (e)=>{
  const btn = e.target.closest("button");
  if (!btn) return;

  const card = e.target.closest(".card");
  if (!card) return;

  const id = card.getAttribute("data-id");
  const dateDebut = card.querySelector(".dateDebut")?.value || "";
  const dateFin = card.querySelector(".dateFin")?.value || "";

  const action =
    btn.classList.contains("save") ? "saveDates" :
    btn.classList.contains("validate") ? "validate" :
    btn.classList.contains("refuse") ? "refuse" :
    null;

  if (!action) return;

  btn.disabled = true;
  const prev = btn.textContent;
  btn.textContent = "⏳";

  try{
    await api("/api/reservations/update", {
      method:"POST",
      body: JSON.stringify({ recordId:id, action, dateDebut, dateFin })
    });

    if (action === "saveDates") {
      setCardMsg(card, "✅ Dates enregistrées.", true);
    } else {
      setCardMsg(card, "✅ Action effectuée.", true);

      card.remove();

      const list = document.getElementById("list");
      if (!list.querySelector(".card")) {
        list.innerHTML = "<div class='small'>Aucune demande en attente.</div>";
      }
    }
  }catch(err){
    setCardMsg(card, `❌ Erreur : ${err.message}`, false);
  }finally{
    btn.disabled = false;
    btn.textContent = prev;
  }
});

document.getElementById("reload").addEventListener("click", load);
load();
</script>
</body>
</html>
