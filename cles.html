<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Administration - Gestion des clés</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:0;background:#f6f7fb}
    header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff;border-bottom:1px solid #eceef5}
    header a{color:#111;text-decoration:none;font-weight:700;margin-right:12px}
    .btn{padding:8px 10px;border-radius:10px;border:1px solid #d8dbe5;background:#fff;cursor:pointer;font-weight:700}
    .wrap{max-width:1100px;margin:18px auto;padding:0 12px}
    .sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}
    .pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#fff;border:1px solid #e2e6f0;font-size:12px;font-weight:800}
    .card{background:#fff;border:1px solid #eceef5;border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 4px 18px rgba(0,0,0,.05)}
    .card.out{border-left:4px solid #d65}
    .row{display:grid;grid-template-columns: 1.2fr 160px 160px 140px 140px 140px;gap:10px;align-items:end}
    label{font-size:12px;color:#555;margin-bottom:5px;display:block}
    input,select,textarea{width:100%;padding:9px;border-radius:10px;border:1px solid #d8dbe5;background:#fff}
    textarea{resize:vertical}
    .badge{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:900;display:inline-block;margin-left:8px}
    .badge.red{background:#fff3f3;color:#8a0000;border:1px solid #ffd2d2}
    .badge.gray{background:#fafafa;color:#444;border:1px solid #e6e6e6}
    .meta{font-size:13px;margin-bottom:8px;color:#222}
    .warn{margin-top:10px;padding:10px;border-radius:10px;background:#fff8e6;border:1px solid #ffe1a3;color:#7a5200;font-size:13px}
    .err{margin-top:8px;color:#b00020;font-size:13px}
    .ok{margin-top:8px;color:#0c5a1a;font-size:13px}
    .rowComment{margin-top:10px}
  </style>
</head>

<body>

<header>
  <div>
    <a href="reservations.html">Réservations</a>
    <a href="cles.html">Gestion des clés</a>
  </div>
  <div>
    <span id="who" style="font-weight:700;color:#444;margin-right:10px"></span>
    <button class="btn" id="logout">Déconnexion</button>
  </div>
</header>

<div class="wrap">

  <div class="sectionTitle">
    <div><strong>À récupérer (trousseaux non rendus)</strong></div>
    <div class="pill red" id="pillOut">…</div>
  </div>
  <div id="listOut"></div>

  <div class="sectionTitle">
    <div><strong>À remettre (clés pas encore données)</strong></div>
    <div class="pill gray" id="pillToGive">…</div>
  </div>
  <div id="listToGive"></div>

</div>

<script>
const WORKER_BASE_URL = "https://pageadministration.cogechirolles.workers.dev";

function logout(){
  localStorage.removeItem("coge_admin_token");
  localStorage.removeItem("coge_admin_name");
  window.location.href="login.html";
}

const token = localStorage.getItem("coge_admin_token");
const adminName = localStorage.getItem("coge_admin_name")||"";
if(!token) window.location.href="login.html";
document.getElementById("who").textContent = adminName ? `Connecté : ${adminName}` : "";
document.getElementById("logout").addEventListener("click",logout);

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));}
function field(f,n){return f?.[n];}

async function api(path,opts={}){
  const r = await fetch(WORKER_BASE_URL+path,{
    ...opts,
    headers:{...(opts.headers||{}),"authorization":"Bearer "+token,"content-type":"application/json"}
  });
  const j = await r.json().catch(()=>({ok:false,error:"Réponse API invalide"}));
  if(!j.ok){
    if(r.status===401) logout();
    throw new Error(j.error || "Erreur API");
  }
  return j;
}

let unavailableNames=[];
let allRecords=[];

const KEYSETS = {
  cavalaire: ["Cavalaire N°1","Cavalaire N°2","Cavalaire N°3"],
  serre: ["Serre-Chevalier N°1","Serre-Chevalier N°2","Serre-Chevalier N°3"]
};

function norm(str){
  return String(str || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[’']/g, "'")
    .replace(/[-_]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function getAptKey(aptField){
  const raw = JSON.stringify(aptField ?? "");
  const s = norm(raw);
  if (s.includes("cavalaire")) return "cavalaire";
  if (s.includes("serre") || s.includes("chevalier") || s.includes("serre chevalier")) return "serre";
  return "";
}

function renderKeyOptions(currentValue, aptKey){
  const allowed = KEYSETS[aptKey] || [];
  let choices = [...allowed];

  choices = choices.filter(name => {
    const isUnavailable = unavailableNames.includes(name);
    const isCurrent = currentValue === name;
    return !isUnavailable || isCurrent;
  });

  if (currentValue && !choices.includes(currentValue)) choices.unshift(currentValue);

  const opts = [`<option value="">—</option>`];
  for (const name of choices) {
    const isUnavailable = unavailableNames.includes(name);
    const isCurrent = currentValue === name;
    const disabled = (isUnavailable && !isCurrent) ? "disabled" : "";
    const suffix = (isUnavailable && isCurrent) ? " (⚠️ non rendu)" : "";
    opts.push(`<option value="${esc(name)}" ${name===currentValue?"selected":""} ${disabled}>${esc(name + suffix)}</option>`);
  }
  return opts.join("");
}

function splitRecords(records){
  const out=[];
  const toGive=[];
  for(const rec of records){
    const f=rec.fields||{};
    const dateRemise=(field(f,"Date de remise")||"").slice(0,10);
    const dateRecup=(field(f,"Date de récupération")||"").slice(0,10);
    if(dateRemise && !dateRecup) out.push(rec);
    if(!dateRemise) toGive.push(rec);
  }
  const outIds=new Set(out.map(r=>r.id));
  return {out,toGive:toGive.filter(r=>!outIds.has(r.id))};
}

function montantPrefill(fields){
  const mp = fields?.["Montant payé"];
  const pt = fields?.["Prix total"];

  if (mp !== undefined && mp !== null && String(mp).trim() !== "") return String(mp);
  if (pt !== undefined && pt !== null && String(pt).trim() !== "") return String(pt);

  return "";
}

function renderCard(rec,isOut){
  const f=rec.fields||{};
  const aptField=field(f,"Appartement");
  const apt=Array.isArray(aptField)?aptField[0]:aptField;
  const aptKey=getAptKey(aptField);

  const jeu=field(f,"Jeu de clés")||"";
  const paye=field(f,"Payé ?")||"";
  const montantValue = montantPrefill(f);
  const dateRemise=(field(f,"Date de remise")||"").slice(0,10);
  const dateRecup=(field(f,"Date de récupération")||"").slice(0,10);

  const commentaireValue =
    (f["Commentaires administrateurs"] ?? rec.commentairesAdministrateurs ?? "");

  const warnAptUnknown = (!aptKey)
    ? `<div class="warn">⚠️ Appartement non reconnu : <b>${esc(String(apt||""))}</b>. Aucun trousseau n’est proposé (sécurité). Vérifie le libellé dans Airtable.</div>`
    : "";

  return `
  <div class="card ${isOut?"out":""}" data-id="${rec.id}">
    <div class="meta">
      <strong>${esc(field(f,"Nom de l'abonné")||"")}</strong>
      ${field(f,"Nom de l’Extérieur")?` — ${esc(field(f,"Nom de l’Extérieur"))}`:""}
      • ${esc(String(apt||""))}
      • ${esc((field(f,"Date de début")||"").slice(0,10))} → ${esc((field(f,"Date de fin")||"").slice(0,10))}
      ${isOut?`<span class="badge red">NON RENDU</span>`:`<span class="badge gray">À REMETTRE</span>`}
    </div>

    <div class="row">
      <div>
        <label>Jeu de clés</label>
        <select class="jeu">${renderKeyOptions(jeu,aptKey)}</select>
      </div>

      <div>
        <label>Payé ?</label>
        <select class="paye">
          <option value="">—</option>
          <option value="Sumup" ${paye==="Sumup"?"selected":""}>Sumup</option>
          <option value="Chèque" ${paye==="Chèque"?"selected":""}>Chèque</option>
          <option value="Non" ${paye==="Non"?"selected":""}>Non</option>
        </select>
      </div>

      <div>
        <label>Montant payé (€)</label>
        <input type="number" step="0.01" class="montant" value="${esc(montantValue)}">
      </div>

      <div>
        <label>Date de remise</label>
        <input type="date" class="dateRemise" value="${esc(dateRemise)}">
      </div>

      <div>
        <label>Date de récupération</label>
        <input type="date" class="dateRecup" value="${esc(dateRecup)}">
      </div>

      <div>
        <button class="btn save">Enregistrer</button>
      </div>
    </div>

    <div class="rowComment">
      <label>Commentaire (facultatif)</label>
      <textarea class="commentaire" rows="3" placeholder="Ex : correction du montant suite à…">${esc(commentaireValue)}</textarea>
    </div>

    ${warnAptUnknown}
    <div class="ok"></div>
    <div class="err"></div>
  </div>`;
}

function recomputeUnavailableNames(records){
  const set = new Set();

  for(const rec of records){
    const f = rec.fields || {};
    const statut = f["Statut de la demande"];
    const jeu = f["Jeu de clés"];
    const dateRemise = (f["Date de remise"] || "").slice(0,10);
    const dateRecup = (f["Date de récupération"] || "").slice(0,10);

    if(statut === "Validée" && jeu && dateRemise && !dateRecup){
      set.add(jeu);
    }
  }

  unavailableNames = Array.from(set);
}

function updateLocalRecord(recordId, patch){
  const rec = allRecords.find(r => r.id === recordId);
  if (!rec) return;

  rec.fields = rec.fields || {};

  if ("jeuDeCles" in patch) rec.fields["Jeu de clés"] = patch.jeuDeCles || "";
  if ("paye" in patch) rec.fields["Payé ?"] = patch.paye || "";
  if ("montantPaye" in patch) {
    rec.fields["Montant payé"] = patch.montantPaye === "" ? null : Number(String(patch.montantPaye).replace(",", "."));
  }
  if ("dateRemise" in patch) rec.fields["Date de remise"] = patch.dateRemise || "";
  if ("dateRecup" in patch) rec.fields["Date de récupération"] = patch.dateRecup || "";
  if ("commentairesAdministrateurs" in patch) {
    rec.fields["Commentaires administrateurs"] = patch.commentairesAdministrateurs || "";
    rec.commentairesAdministrateurs = patch.commentairesAdministrateurs || "";
  }

  recomputeUnavailableNames(allRecords);
}

function render(){
  const {out,toGive}=splitRecords(allRecords);
  document.getElementById("pillOut").textContent=out.length;
  document.getElementById("pillToGive").textContent=toGive.length;

  document.getElementById("listOut").innerHTML =
    out.length ? out.map(r=>renderCard(r,true)).join("") : `<div class="meta">Rien à récupérer.</div>`;

  document.getElementById("listToGive").innerHTML =
    toGive.length ? toGive.map(r=>renderCard(r,false)).join("") : `<div class="meta">Rien à remettre.</div>`;

  bind();
}

function bind(){
  document.querySelectorAll(".card").forEach(card=>{
    card.querySelector(".save").onclick = async () => {
      const id = card.dataset.id;
      const jeu = card.querySelector(".jeu").value;
      const paye = card.querySelector(".paye").value;
      const montant = card.querySelector(".montant").value;
      const dateRemise = card.querySelector(".dateRemise").value;
      const dateRecup = card.querySelector(".dateRecup").value;
      const commentaire = (card.querySelector(".commentaire")?.value || "").trim();

      const errBox = card.querySelector(".err");
      const okBox = card.querySelector(".ok");
      errBox.textContent = "";
      okBox.textContent = "";

      // 🔒 sécurité : impossible d'attribuer un trousseau sans date de remise
      if (jeu && !dateRemise) {
        errBox.textContent = "Veuillez renseigner la date de remise des clés.";
        return;
      }

      try{
        const body = {
          recordId: id,
          jeuDeCles: jeu,
          paye,
          montantPaye: montant,
          dateRemise,
          dateRecup
        };

        if (commentaire !== "") {
          body.commentairesAdministrateurs = commentaire;
        }

        await api("/api/cles/update", {
          method: "POST",
          body: JSON.stringify(body)
        });

        updateLocalRecord(id, body);
        render();
      }catch(e){
        errBox.textContent = e.message;
      }
    };
  });
}

async function load(){
  const j=await api("/api/cles/list",{method:"GET"});
  allRecords=j.records||[];
  unavailableNames=(j.unavailableKeySets?.names)||[];
  render();
}

load();
</script>

</body>
</html>
