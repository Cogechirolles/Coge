<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Administration - Gestion des clés</title>

  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:0;background:#f6f7fb}
    header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff;border-bottom:1px solid #eceef5}
    header a{font-weight:800;text-decoration:none;color:#111;margin-right:15px}
    .btn{padding:8px 10px;border-radius:10px;border:1px solid #d8dbe5;background:#fff;font-weight:800;cursor:pointer}
    .wrap{max-width:1100px;margin:18px auto;padding:0 12px}
    .sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}
    .pill{padding:6px 10px;border-radius:999px;font-size:13px;font-weight:900}
    .pill.red{background:#fff3f3;color:#8a0000;border:1px solid #ffd2d2}
    .pill.gray{background:#fafafa;color:#444;border:1px solid #e6e6e6}
    .card{background:#fff;border:1px solid #eceef5;border-radius:12px;padding:14px;margin-bottom:12px}
    .card.out{border-color:#ffd2d2}
    .row{display:grid;grid-template-columns:1.1fr 170px 170px 190px 140px 140px;gap:10px;align-items:end}
    label{font-size:12px;color:#555;margin-bottom:5px;display:block}
    input,select{width:100%;padding:9px;border-radius:10px;border:1px solid #d8dbe5;background:#fff}
    .badge{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:900}
    .badge.red{background:#fff3f3;color:#8a0000;border:1px solid #ffd2d2}
    .badge.gray{background:#fafafa;color:#444;border:1px solid #e6e6e6}
    .meta{font-size:13px;margin-bottom:8px}
    .err{margin-top:8px;color:#b00020;font-size:13px}
  </style>
</head>

<body>

<header>
  <div>
    <a href="reservations.html">Réservations</a>
    <a href="cles.html">Gestion des clés</a>
  </div>
  <div>
    <span id="who"></span>
    <button class="btn" id="logout">Déconnexion</button>
  </div>
</header>

<div class="wrap">

  <div class="sectionTitle">
    <div><strong>À récupérer (trousseaux non rendus)</strong></div>
    <div class="pill red" id="pillOut">…</div>
  </div>
  <div id="listOut"></div>

  <div class="sectionTitle">
    <div><strong>À remettre (clés pas encore données)</strong></div>
    <div class="pill gray" id="pillToGive">…</div>
  </div>
  <div id="listToGive"></div>

</div>

<script>
const WORKER_BASE_URL = "https://pageadministration.cogechirolles.workers.dev";

function logout(){
  localStorage.removeItem("coge_admin_token");
  localStorage.removeItem("coge_admin_name");
  window.location.href="login.html";
}

const token = localStorage.getItem("coge_admin_token");
const adminName = localStorage.getItem("coge_admin_name")||"";
if(!token) window.location.href="login.html";
document.getElementById("who").textContent = adminName;
document.getElementById("logout").addEventListener("click",logout);

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));}
function field(f,n){return f?.[n];}

async function api(path,opts={}){
  const r = await fetch(WORKER_BASE_URL+path,{
    ...opts,
    headers:{...(opts.headers||{}),"authorization":"Bearer "+token,"content-type":"application/json"}
  });
  const j = await r.json();
  if(!j.ok){if(r.status===401)logout();throw new Error(j.error);}
  return j;
}

let unavailableNames=[];
let allRecords=[];

// --- Catalogue clé par appartement
const KEYSETS={
  cavalaire:["Cavalaire N°1","Cavalaire N°2","Cavalaire N°3"],
  serre:["Serre-Chevalier N°1","Serre-Chevalier N°2","Serre-Chevalier N°3"]
};

function getAptKey(aptField){
  const apt=Array.isArray(aptField)?aptField[0]:aptField;
  const s=String(apt||"").toLowerCase();
  if(s.includes("cavalaire")) return "cavalaire";
  if(s.includes("serre")) return "serre";
  return "";
}

function renderKeyOptions(currentValue,aptKey){
  const allowed=KEYSETS[aptKey]||[];
  let visible=allowed.filter(name=>{
    const isUnavailable=unavailableNames.includes(name);
    const isCurrent=currentValue===name;
    return !isUnavailable||isCurrent;
  });

  if(currentValue&&!visible.includes(currentValue)) visible.unshift(currentValue);

  return visible.map(name=>{
    const isUnavailable=unavailableNames.includes(name);
    const disabled=(isUnavailable&&currentValue!==name)?"disabled":"";
    return `<option value="${esc(name)}" ${name===currentValue?"selected":""} ${disabled}>${esc(name)}</option>`;
  }).join("");
}

function splitRecords(records){
  const out=[];
  const toGive=[];
  for(const rec of records){
    const f=rec.fields||{};
    const dateRemise=(field(f,"Date de remise")||"").slice(0,10);
    const dateRecup=(field(f,"Date de récupération")||"").slice(0,10);
    if(dateRemise&&!dateRecup) out.push(rec);
    if(!dateRemise) toGive.push(rec);
  }
  const outIds=new Set(out.map(r=>r.id));
  return {out,toGive:toGive.filter(r=>!outIds.has(r.id))};
}

function renderCard(rec,isOut){
  const f=rec.fields||{};
  const aptField=field(f,"Appartement");
  const apt=Array.isArray(aptField)?aptField[0]:aptField;
  const aptKey=getAptKey(aptField);

  const jeu=field(f,"Jeu de clés")||"";
  const paye=field(f,"Payé ?")||"";
  const montant=field(f,"Montant payé")||"";
  const dateRemise=(field(f,"Date de remise")||"").slice(0,10);
  const dateRecup=(field(f,"Date de récupération")||"").slice(0,10);

  return `
  <div class="card ${isOut?"out":""}" data-id="${rec.id}">
    <div class="meta">
      <strong>${esc(field(f,"Nom de l'abonné"))}</strong>
      ${field(f,"Nom de l’Extérieur")?` — ${esc(field(f,"Nom de l’Extérieur"))}`:""}
      • ${esc(apt)}
      • ${esc((field(f,"Date de début")||"").slice(0,10))} → ${esc((field(f,"Date de fin")||"").slice(0,10))}
      ${isOut?`<span class="badge red">NON RENDU</span>`:`<span class="badge gray">À REMETTRE</span>`}
    </div>

    <div class="row">
      <div>
        <label>Jeu de clés</label>
        <select class="jeu">${renderKeyOptions(jeu,aptKey)}</select>
      </div>

      <div>
        <label>Payé ?</label>
        <select class="paye">
          <option value="">—</option>
          <option value="Sumup" ${paye==="Sumup"?"selected":""}>Sumup</option>
          <option value="Chèque" ${paye==="Chèque"?"selected":""}>Chèque</option>
          <option value="Non" ${paye==="Non"?"selected":""}>Non</option>
        </select>
      </div>

      <div>
        <label>Montant payé</label>
        <input type="number" class="montant" value="${esc(montant)}">
      </div>

      <div>
        <label>Date de remise</label>
        <input type="date" class="dateRemise" value="${esc(dateRemise)}">
      </div>

      <div>
        <label>Date de récupération</label>
        <input type="date" class="dateRecup" value="${esc(dateRecup)}">
      </div>

      <div>
        <button class="btn save">Enregistrer</button>
      </div>
    </div>

    <div class="err"></div>
  </div>`;
}

function render(){
  const {out,toGive}=splitRecords(allRecords);
  document.getElementById("pillOut").textContent=out.length;
  document.getElementById("pillToGive").textContent=toGive.length;
  document.getElementById("listOut").innerHTML=out.map(r=>renderCard(r,true)).join("");
  document.getElementById("listToGive").innerHTML=toGive.map(r=>renderCard(r,false)).join("");
  bind();
}

function bind(){
  document.querySelectorAll(".card").forEach(card=>{
    card.querySelector(".save").onclick=async()=>{
      const id=card.dataset.id;
      const jeu=card.querySelector(".jeu").value;
      const paye=card.querySelector(".paye").value;
      const montant=card.querySelector(".montant").value;
      const dateRemise=card.querySelector(".dateRemise").value;
      const dateRecup=card.querySelector(".dateRecup").value;
      try{
        await api("/api/cles/update",{method:"POST",body:JSON.stringify({recordId:id,jeuDeCles:jeu,paye,montantPaye:montant,dateRemise,dateRecup})});
        load();
      }catch(e){
        card.querySelector(".err").textContent=e.message;
      }
    };
  });
}

async function load(){
  const j=await api("/api/cles/list",{method:"GET"});
  allRecords=j.records||[];
  unavailableNames=(j.unavailableKeySets?.names)||[];
  render();
}

load();
</script>

</body>
</html>
