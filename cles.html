<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Administration - Gestion des clés</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:0;background:#f6f7fb}
    header{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;background:#fff;border-bottom:1px solid #eceef5}
    header .left{display:flex;gap:10px;align-items:center}
    header a{color:#111;text-decoration:none;font-weight:800}
    .right{display:flex;gap:10px;align-items:center}
    .btn{padding:8px 10px;border-radius:10px;border:1px solid #d8dbe5;background:#fff;cursor:pointer;font-weight:800}
    .wrap{max-width:1100px;margin:18px auto;padding:0 12px}
    .topline{display:flex;gap:10px;align-items:flex-end;justify-content:space-between;margin:8px 0 12px}
    .small{font-size:13px;color:#555}
    .filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    select{padding:9px 10px;border:1px solid #d8dbe5;border-radius:10px;background:#fff;font-weight:700}

    .sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}
    .sectionTitle .h{font-weight:900;font-size:16px}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;border:1px solid #eceef5;background:#fff;font-size:13px;font-weight:900}
    .pill.red{border-color:#ffd2d2;background:#fff3f3;color:#8a0000}
    .pill.gray{border-color:#e6e6e6;background:#fafafa;color:#444}

    .card{background:#fff;border:1px solid #eceef5;border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 4px 18px rgba(0,0,0,.05)}
    .card.out{border-color:#ffd2d2}
    .headrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .title{font-weight:900}
    .badge{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:900;border:1px solid #eceef5;background:#fff}
    .badge.red{border-color:#ffd2d2;background:#fff3f3;color:#8a0000}
    .badge.gray{border-color:#e6e6e6;background:#fafafa;color:#444}

    .row{display:grid;grid-template-columns: 1.1fr 170px 170px 190px 140px 140px;gap:10px;align-items:end}
    label{display:block;font-size:12px;color:#555;margin-bottom:5px}
    input{width:100%;padding:9px 10px;border:1px solid #d8dbe5;border-radius:10px;font-size:14px;background:#fff}
    .meta{font-size:13px;color:#333}
    .warn{margin-top:10px;padding:10px;border-radius:10px;background:#fff8e6;border:1px solid #ffe1a3;color:#7a5200;font-size:13px}
    .err{margin-top:10px;padding:10px;border-radius:10px;background:#fff3f3;border:1px solid #ffd2d2;color:#8a0000;font-size:13px}
    button{padding:9px 12px;border-radius:10px;border:1px solid #d8dbe5;background:#fff;cursor:pointer;font-weight:800}
    button.primary{background:#111;color:#fff;border-color:#111}
  </style>
</head>
<body>
<header>
  <div class="left">
    <a href="reservations.html">Réservations</a>
    <a href="cles.html">Gestion des clés</a>
  </div>
  <div class="right">
    <div class="small" id="who"></div>
    <button class="btn" id="logout">Déconnexion</button>
  </div>
</header>

<div class="wrap">
  <div class="topline">
    <div>
      <div style="font-weight:900;font-size:18px">Gestion des clés</div>
      <div class="small">Validées : à remettre (pas encore remises) + à récupérer (trousseau non rendu)</div>
    </div>
    <div class="filters">
      <label class="small" for="aptFilter">Appartement</label>
      <select id="aptFilter">
        <option value="">Tous</option>
        <option value="Cavalaire">Cavalaire</option>
        <option value="Serre-Chevalier">Serre-Chevalier</option>
      </select>
      <button class="btn" id="reload">Rafraîchir</button>
    </div>
  </div>

  <div class="sectionTitle">
    <div class="h">À récupérer (trousseau non rendu)</div>
    <div class="pill red" id="pillOut">…</div>
  </div>
  <div id="listOut"></div>

  <div class="sectionTitle">
    <div class="h">À remettre (clés pas encore données)</div>
    <div class="pill gray" id="pillToGive">…</div>
  </div>
  <div id="listToGive"></div>
</div>

<script>
const WORKER_BASE_URL = "https://pageadministration.cogechirolles.workers.dev";

function logout(){
  localStorage.removeItem("coge_admin_token");
  localStorage.removeItem("coge_admin_name");
  window.location.href = "login.html";
}

const token = localStorage.getItem("coge_admin_token");
const adminName = localStorage.getItem("coge_admin_name") || "";
document.getElementById("who").textContent = adminName ? `Connecté : ${adminName}` : "";
document.getElementById("logout").addEventListener("click", logout);
if (!token) window.location.href = "login.html";

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));}
function field(fields, name){ return fields?.[name]; }

async function api(path, opts={}){
  const r = await fetch(`${WORKER_BASE_URL}${path}`, {
    ...opts,
    headers: {
      ...(opts.headers||{}),
      "authorization": `Bearer ${token}`,
      "content-type": "application/json"
    }
  });
  const j = await r.json().catch(()=>({ok:false,error:"Réponse API invalide"}));
  if (!j.ok) {
    if (r.status === 401) logout();
    throw new Error(j.error || "Erreur API");
  }
  return j;
}

let unavailableNames = [];
let allRecords = [];

function renderKeyOptions(currentValue){
  const all = [
    "Cavalaire N°1","Cavalaire N°2","Cavalaire N°3",
    "Serre-Chevalier N°1","Serre-Chevalier N°2","Serre-Chevalier N°3"
  ];
  return all.map(name=>{
    const isUnavailable = unavailableNames.includes(name);
    const isCurrent = currentValue === name;
    const disabled = (isUnavailable && !isCurrent) ? "disabled" : "";
    const suffix = (isUnavailable && !isCurrent) ? " (non rendu)" : "";
    return `<option value="${esc(name)}" ${name===currentValue?"selected":""} ${disabled}>${esc(name + suffix)}</option>`;
  }).join("");
}

function matchAptFilter(apt){
  const v = document.getElementById("aptFilter").value;
  if (!v) return true;
  return String(apt||"").includes(v);
}

function renderCard(rec, isOut){
  const f = rec.fields || {};
  const recordId = rec.id;

  const nomA = field(f,"Nom de l'abonné") || "";
  const nomE = field(f,"Nom de l’Extérieur") || "";
  const apt = Array.isArray(field(f,"Appartement")) ? field(f,"Appartement")[0] : (field(f,"Appartement")||"");
  const dd = (field(f,"Date de début")||"").slice(0,10);
  const df = (field(f,"Date de fin")||"").slice(0,10);

  const jeu = field(f,"Jeu de clés") || "";
  const paye = field(f,"Payé ?") || "";
  const montant = (field(f,"Montant payé") ?? "");
  const prixTotal = field(f,"Prix total");
  const dateRemise = (field(f,"Date de remise")||"").slice(0,10);
  const dateRecup = (field(f,"Date de récupération")||"").slice(0,10);

  const montantValue = (montant === "" || montant === null || montant === undefined) ? "" : montant;
  const montantPlaceholder = (prixTotal!==undefined && prixTotal!==null) ? String(prixTotal) : "";

  const warn = (jeu && unavailableNames.includes(jeu))
    ? `<div class="warn">🔒 Jeu de clés "${esc(jeu)}" sorti : indisponible tant que "Date de récupération" n’est pas remplie.</div>`
    : "";

  return `
  <div class="card ${isOut ? "out":""}" data-id="${esc(recordId)}">
    <div class="headrow">
      <div class="title">${esc(apt)} • ${esc(dd)} → ${esc(df)}</div>
      <div style="display:flex;gap:8px;align-items:center">
        ${isOut ? `<span class="badge red">TRUSSEAU NON RENDU</span>` : `<span class="badge gray">À REMETTRE</span>`}
        <span class="badge gray">#${esc(recordId.slice(-6))}</span>
      </div>
    </div>

    <div class="meta" style="margin-bottom:10px">
      <b>${esc(nomA)}</b>${nomE?` — Extérieur : <b>${esc(nomE)}</b>`:""}
    </div>

    <div class="row">
      <div>
        <label>Jeu de clés</label>
        <select class="jeu" style="width:100%;padding:9px 10px;border:1px solid #d8dbe5;border-radius:10px;background:#fff;font-weight:700">
          <option value="">—</option>
          ${renderKeyOptions(jeu)}
        </select>
      </div>

      <div>
        <label>Payé ?</label>
        <select class="paye" style="width:100%;padding:9px 10px;border:1px solid #d8dbe5;border-radius:10px;background:#fff;font-weight:700">
          <option value="">—</option>
          <option value="Sumup" ${paye==="Sumup"?"selected":""}>Sumup</option>
          <option value="Chèque" ${paye==="Chèque"?"selected":""}>Chèque</option>
          <option value="Non" ${paye==="Non"?"selected":""}>Non</option>
        </select>
      </div>

      <div>
        <label>Montant payé (€)</label>
        <input class="montant" type="number" step="0.01" value="${esc(montantValue)}" placeholder="${esc(montantPlaceholder)}" />
      </div>

      <div>
        <label>Date de remise</label>
        <input class="dateRemise" type="date" value="${esc(dateRemise)}" />
      </div>

      <div>
        <label>Date de récupération</label>
        <input class="dateRecup" type="date" value="${esc(dateRecup)}" />
      </div>

      <div>
        <label>&nbsp;</label>
        <button class="primary save">Enregistrer</button>
      </div>
    </div>

    ${warn}
    <div class="err" style="display:none"></div>
  </div>`;
}

function splitRecords(records){
  const out = [];     // clés sorties mais pas rendues
  const toGive = [];  // clés pas encore remises

  for (const rec of records) {
    const f = rec.fields || {};
    const dateRemise = (field(f,"Date de remise")||"").slice(0,10);
    const dateRecup = (field(f,"Date de récupération")||"").slice(0,10);

    const isOut = !!dateRemise && !dateRecup; // ✅ sorti = remise faite
    const isToGive = !dateRemise;             // ✅ à remettre = pas remis

    if (isOut) out.push(rec);
    if (isToGive) toGive.push(rec);
  }

  // éviter doublons
  const outIds = new Set(out.map(r => r.id));
  const toGiveFiltered = toGive.filter(r => !outIds.has(r.id));

  return { out, toGive: toGiveFiltered };
}

function render(){
  const { out, toGive } = splitRecords(allRecords);

  const outF = out.filter(r=>{
    const apt = Array.isArray(r.fields?.["Appartement"]) ? r.fields["Appartement"][0] : r.fields?.["Appartement"];
    return matchAptFilter(apt);
  });

  const toGiveF = toGive.filter(r=>{
    const apt = Array.isArray(r.fields?.["Appartement"]) ? r.fields["Appartement"][0] : r.fields?.["Appartement"];
    return matchAptFilter(apt);
  });

  document.getElementById("pillOut").textContent = `${outF.length} à récupérer`;
  document.getElementById("pillToGive").textContent = `${toGiveF.length} à remettre`;

  document.getElementById("listOut").innerHTML =
    outF.length ? outF.map(r=>renderCard(r,true)).join("") : `<div class="small">Rien à récupérer.</div>`;

  document.getElementById("listToGive").innerHTML =
    toGiveF.length ? toGiveF.map(r=>renderCard(r,false)).join("") : `<div class="small">Rien à remettre.</div>`;

  bind();
}

function bind(){
  document.querySelectorAll(".card").forEach(card=>{
    const id = card.getAttribute("data-id");
    const errBox = card.querySelector(".err");

    card.querySelector(".save").addEventListener("click", async ()=>{
      errBox.style.display = "none";
      errBox.textContent = "";

      const jeu = card.querySelector(".jeu").value;
      const paye = card.querySelector(".paye").value;
      let montant = card.querySelector(".montant").value;
      const dateRemise = card.querySelector(".dateRemise").value;
      const dateRecup = card.querySelector(".dateRecup").value;

      // ergonomie: si montant vide => on met le placeholder (prix total)
      if (!montant) {
        const ph = card.querySelector(".montant").getAttribute("placeholder") || "";
        if (ph) montant = ph;
      }

      try{
        await api("/api/cles/update", {
          method:"POST",
          body: JSON.stringify({
            recordId: id,
            jeuDeCles: jeu,
            paye,
            montantPaye: montant,
            dateRemise,
            dateRecup
          })
        });
        await load();
      }catch(e){
        errBox.style.display = "block";
        errBox.textContent = e.message;
      }
    });
  });
}

async function load(){
  document.getElementById("listOut").innerHTML = "Chargement…";
  document.getElementById("listToGive").innerHTML = "";

  try{
    const j = await api("/api/cles/list", { method:"GET" });
    allRecords = j.records || [];
    unavailableNames = (j.unavailableKeySets?.names) || [];
    render();
  }catch(e){
    document.getElementById("listOut").innerHTML = `<div class="err">Erreur : ${esc(e.message)}</div>`;
    document.getElementById("listToGive").innerHTML = "";
  }
}

document.getElementById("reload").addEventListener("click", load);
document.getElementById("aptFilter").addEventListener("change", render);
load();
</script>
</body>
</html>
